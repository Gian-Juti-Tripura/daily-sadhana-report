    <!-- Early capture of PWA beforeinstallprompt so it is NEVER lost on load -->
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa_installed_success'));
        console.log('Sadhana PWA was successfully installed');
      });
    </script>
    <script src="/registerSW.js"></script>

    <!-- Automatic Stale Deployment Recovery (Auto-reloads if old CSS/JS chunk hashes mismatch) -->
    <script>
      window.addEventListener('vite:preloadError', function() {
        window.location.reload();
      });
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'LINK' || e.target.tagName === 'SCRIPT')) {
          var key = 'advaita_chunk_reload_ts';
          var last = sessionStorage.getItem(key);
          var now = Date.now();
          if (!last || now - parseInt(last, 10) > 10000) {
            sessionStorage.setItem(key, String(now));
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
            window.location.reload();
          }
        }
      }, true);
    </script>
